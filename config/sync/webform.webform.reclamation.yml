id: reclamation
title: 'Réclamation des travailleurs Tunisiens à l''étranger'
description: ''
categories: {  }
elements: |-
  processed_text:
    '#type': processed_text
    '#text': "<h2>IMPORTANT</h2>\r\n\r\n<ul>\r\n\t<li>Il s’agit d’une procédure totalement gratuite.</li>\r\n\t<li>Aucunes données confidentielles propres au réclamant ou à la réclamation ne sera divulguée à toute autre personne que les services internes de l’ANETI sans l’accord explicite du réclamant.</li>\r\n\t<li>La prise en charge de la réclamation garantit un processus d’enregistrement de la réclamation et d’information aux entités concernées.</li>\r\n\t<li>La prise en charge ne donne pas droit à une prise en charge automatique, par les services de l’ANETI, à une procédure de gestion de différends.</li>\r\n\t<li>La procédure pédagogique de réclamation est visible sur ce <a href=\"https://www.ilo.org/global/topics/fair-recruitment/WCMS_568730/lang--fr/index.htm\">lien</a></li>\r\n</ul>\r\n"
    '#format': full_html
  informations_reclamant:
    '#type': fieldset
    '#title': 'Informations réclamant'
    '#description_display': before
    nom_et_prenom:
      '#type': textfield
      '#title': 'Nom et prénom'
    telephone:
      '#type': textfield
      '#title': Téléphone
    email:
      '#type': email
      '#title': Email
    cin:
      '#type': textfield
      '#title': CIN
  informations_employeur:
    '#type': fieldset
    '#title': 'Informations employeur'
    raison_sociale:
      '#type': textfield
      '#title': 'Raison sociale'
    autres_informations:
      '#type': textarea
      '#title': 'Autres informations'
      '#description': 'Toute information sur l&rsquo;entreprise ou toute autre intervenant dans le processus de recrutement et d&eacute;marches de contractualisation, ainsi que les indications sur son emplacement et &eacute;ventuellement toute information permettant son identification d&rsquo;une mani&egrave;re ais&eacute;e.'
      '#help_title': Aide
      '#help': 'Toute information sur l&rsquo;entreprise ou toute autre intervenant dans le processus de recrutement et d&eacute;marches de contractualisation, ainsi que les indications sur son emplacement et &eacute;ventuellement toute information permettant son identification d&rsquo;une mani&egrave;re ais&eacute;e.'
  reclamation:
    '#type': fieldset
    '#title': Réclamation
    gravite_de_la_situation:
      '#type': webform_checkboxes_other
      '#title': 'Gravité de la situation'
      '#options':
        Violence: Violence
        Séquestration: Séquestration
        'Interdiction de se déplacer': 'Interdiction de se déplacer'
        'Rétention des documents officiels': 'Rétention des documents officiels'
      '#other__type': textarea
    objet_de_la_reclamation:
      '#type': textfield
      '#title': 'Objet de la réclamation'
    reclamation_txt:
      '#type': textarea
      '#title': Réclamation
    date_de_l_incident:
      '#type': date
      '#title': 'Date de l''incident'
      '#datepicker': true
  etat_de_la_reclamation:
    '#type': select
    '#title': 'Etat de la réclamation'
    '#options':
      'En attente': 'En attente'
      'En cours de traitement': 'En cours de traitement'
      Finalisée: Finalisée
      Rejetée: Rejetée
    '#required': true
    '#default_value': 'En attente'
    '#access_create_roles':
      - super_admin
      - administrator
  informations_supplementaires:
    '#type': details
    '#title': 'Informations supplémentaires'
    source_du_contrat:
      '#type': webform_radios_other
      '#title': 'Source du contrat'
      '#options':
        'plateforme de l’ANETI': 'plateforme de l’ANETI'
    cadre_de_signature_de_contrat:
      '#type': webform_radios_other
      '#title': 'Cadre de signature de contrat'
      '#options':
        'Processus assuré par les services de l’ANETI': 'Processus assuré par les services de l’ANETI'
    vous_etes:
      '#type': radios
      '#title': 'Vous êtes'
      '#options':
        'Travailleur à l’étranger': 'Travailleur à l’étranger'
        'De retour en Tunisie': 'De retour en Tunisie'
    contrat_obtenu_a_la_suite_d_une_demarche_propre_a_:
      '#type': webform_radios_other
      '#title': "Contrat obtenu à la suite d’une démarche propre à\_:"
      '#options':
        'L''ANETI': 'L''ANETI'
        'Autres structures tunisiennes publiques (telle que l’ATCT)': 'Autres structures tunisiennes publiques (telle que l’ATCT)'
        'Autres entités privées (tunisiennes ou internationales)': 'Autres entités privées (tunisiennes ou internationales)'
