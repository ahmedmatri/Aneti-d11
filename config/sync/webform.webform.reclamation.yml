id: reclamation
title: 'Réclamation des travailleurs Tunisiens à l''étranger'
description: ''
category: ''
elements: "processed_text:\n  '#type': processed_text\n  '#text': \"<h2>IMPORTANT</h2>\\r\\n\\r\\n<ul>\\r\\n\\t<li>Il s’agit d’une procédure totalement gratuite.</li>\\r\\n\\t<li>Aucunes données confidentielles propres au réclamant ou à la réclamation ne sera divulguée à toute autre personne que les services internes de l’ANETI sans l’accord explicite du réclamant.</li>\\r\\n\\t<li>La prise en charge de la réclamation garantit un processus d’enregistrement de la réclamation et d’information aux entités concernées.</li>\\r\\n\\t<li>La prise en charge ne donne pas droit à une prise en charge automatique, par les services de l’ANETI, à une procédure de gestion de différends.</li>\\r\\n\\t<li>La procédure pédagogique de réclamation est visible sur ce <a href=\\\"https://www.ilo.org/global/topics/fair-recruitment/WCMS_568730/lang--fr/index.htm\\\">lien</a></li>\\r\\n</ul>\\r\\n\"\n  '#format': full_html\ninformations_reclamant:\n  '#type': fieldset\n  '#title': 'Informations réclamant'\n  '#description_display': before\n  nom_et_prenom:\n    '#type': textfield\n    '#title': 'Nom et prénom'\n  telephone:\n    '#type': textfield\n    '#title': Téléphone\n  email:\n    '#type': email\n    '#title': Email\n  cin:\n    '#type': textfield\n    '#title': CIN\ninformations_employeur:\n  '#type': fieldset\n  '#title': 'Informations employeur'\n  raison_sociale:\n    '#type': textfield\n    '#title': 'Raison sociale'\n  autres_informations:\n    '#type': textarea\n    '#title': 'Autres informations'\n    '#description': 'Toute information sur l&rsquo;entreprise ou toute autre intervenant dans le processus de recrutement et d&eacute;marches de contractualisation, ainsi que les indications sur son emplacement et &eacute;ventuellement toute information permettant son identification d&rsquo;une mani&egrave;re ais&eacute;e.'\n    '#help_title': Aide\n    '#help': 'Toute information sur l&rsquo;entreprise ou toute autre intervenant dans le processus de recrutement et d&eacute;marches de contractualisation, ainsi que les indications sur son emplacement et &eacute;ventuellement toute information permettant son identification d&rsquo;une mani&egrave;re ais&eacute;e.'\nreclamation:\n  '#type': fieldset\n  '#title': Réclamation\n  gravite_de_la_situation:\n    '#type': webform_checkboxes_other\n    '#title': 'Gravité de la situation'\n    '#options':\n      Violence: Violence\n      Séquestration: Séquestration\n      'Interdiction de se déplacer': 'Interdiction de se déplacer'\n      'Rétention des documents officiels': 'Rétention des documents officiels'\n    '#other__type': textarea\n  objet_de_la_reclamation:\n    '#type': textfield\n    '#title': 'Objet de la réclamation'\n  reclamation_txt:\n    '#type': textarea\n    '#title': Réclamation\n  date_de_l_incident:\n    '#type': date\n    '#title': 'Date de l''incident'\n    '#datepicker': true\netat_de_la_reclamation:\n  '#type': select\n  '#title': 'Etat de la réclamation'\n  '#options':\n    'En attente': 'En attente'\n    'En cours de traitement': 'En cours de traitement'\n    Finalisée: Finalisée\n    Rejetée: Rejetée\n  '#required': true\n  '#default_value': 'En attente'\n  '#access_create_roles':\n    - super_admin\n    - administrator\ninformations_supplementaires:\n  '#type': details\n  '#title': 'Informations supplémentaires'\n  source_du_contrat:\n    '#type': webform_radios_other\n    '#title': 'Source du contrat'\n    '#options':\n      'plateforme de l’ANETI': 'plateforme de l’ANETI'\n  cadre_de_signature_de_contrat:\n    '#type': webform_radios_other\n    '#title': 'Cadre de signature de contrat'\n    '#options':\n      'Processus assuré par les services de l’ANETI': 'Processus assuré par les services de l’ANETI'\n  vous_etes:\n    '#type': radios\n    '#title': 'Vous êtes'\n    '#options':\n      'Travailleur à l’étranger': 'Travailleur à l’étranger'\n      'De retour en Tunisie': 'De retour en Tunisie'\n  contrat_obtenu_a_la_suite_d_une_demarche_propre_a_:\n    '#type': webform_radios_other\n    '#title': \"Contrat obtenu à la suite d’une démarche propre à\\_:\"\n    '#options':\n      'L''ANETI': 'L''ANETI'\n      'Autres structures tunisiennes publiques (telle que l’ATCT)': 'Autres structures tunisiennes publiques (telle que l’ATCT)'\n      'Autres entités privées (tunisiennes ou internationales)': 'Autres entités privées (tunisiennes ou internationales)'"
