    subject: 'Résultat de votre entretien – Poste d’agent de manutention en Italie'
    message:
      value: "Cher/Chère candidat(e),\r\n\r\nL’équipe de l’ANETI espère que ce message vous trouve en bonne santé.\r\n\r\nNous vous remercions d’avoir participé au processus de sélection pour le poste d’agent de manutention en Italie.\r\nAprès examen attentif de votre profil et des entretiens réalisés, nous regrettons de vous informer que votre candidature n’a pas été retenue à cette étape.\r\n\r\nCette décision a été particulièrement difficile à prendre, compte tenu de la qualité des profils reçus et de la motivation des candidats.\r\n\r\nNous vous remercions sincèrement pour votre intérêt, votre implication et la confiance que vous nous avez accordée.\r\n\r\n👉 Nous vous encourageons vivement à poursuivre vos démarches et à consulter régulièrement les nouvelles opportunités publiées sur notre site :\r\n🌐 www.aneti-international.tn\r\n\r\nNous vous souhaitons beaucoup de succès dans vos projets futurs et restons à votre disposition pour vous accompagner dans votre parcours professionnel à l’international.\r\n\r\nCordialement,\r\nL’équipe ANETI"
      format: plain_text
