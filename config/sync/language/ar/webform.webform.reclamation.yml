elements: |
  processed_text:
    '#text': "<h2>هام</h2>\n\n<ul>\n\t<li>هذا إجراء مجاني </li>\n\t<li>لن يتم الكشف عن أي بيانات سرية خاصة بمقدم الشكوى أو الشكوى لأي شخص بخلاف الإدارات الداخلية في الوكالة الوطنية للتشغيل والعمل المستقل دون موافقة صريحة من مقدم الشكوى.</li>\n\t<li>تضمن معالجة الشكوى عملية تسجيل الشكوى وإبلاغ الجهات المعنية.</li>\n\t<li>La prise en charge ne donne pas droit à une prise en charge automatique, par les services de l’ANETI, à une procédure de gestion de différends.</li>\n\t<li>La procédure pédagogique de réclamation est visible sur ce <a href=\"https://www.ilo.org/global/topics/fair-recruitment/WCMS_568730/lang--fr/index.htm\">lien</a></li>\n</ul>\n"
