langcode: fr
id: aneti_upgrade_d7_files
label: Public files
audit: true
migration_tags:
  - Drupal 7
  - Content
migration_group: migrate_aneti
source:
  plugin: d7_file
  scheme: public
  constants:
    source_base_path: '/var/www/html/aneti-prod-final-clean/aneti-prod/web/sites/default/files/migration-files'
process:
  fid: fid
  filename: filename
  source_full_path:
    -
      plugin: concat
      delimiter: /
      source:
        - constants/source_base_path
        - filepath
    -
      plugin: urlencode
  uri:
    plugin: aneti_file_copy
    source:
      - '@source_full_path'
      - uri
  filemime: filemime
  # No need to migrate filesize, it is computed when file entities are saved.
  # filesize: filesize
  status: status
  # Drupal 7 didn't keep track of the file's creation or update time -- all it
  # had was the vague "timestamp" column. So we'll use it for both.
  created: timestamp
  changed: timestamp
  uid: uid 
destination:
  plugin: entity:file
